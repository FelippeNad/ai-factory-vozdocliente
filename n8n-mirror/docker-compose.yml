# Mirror local n8n do VozDoCliente Review Router (para testar o fluxo sem o Make/produção).
# Versão FIXADA de propósito — não troque por :latest (a tag muda sozinha e já quebrou o login).
# n8n v1/v2 REMOVEU o basic auth (admin/admin): no 1º acesso o n8n pede para criar uma
# CONTA DE DONO (owner) — email + senha locais, só na sua máquina.
# A porta é publicada só no loopback (127.0.0.1) para NÃO expor o editor na rede.
services:
  n8n:
    image: n8nio/n8n:2.28.7
    container_name: vozdocliente-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # As credenciais reais (OpenAI, Airtable, Slack) são criadas pela UI do n8n.
      # AIRTABLE_BASE_ID é lido pelo node "Airtable Create" via {{$env.AIRTABLE_BASE_ID}}.
      - AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID}
      # Router v4 otimizado: ausentes permanecem vazias e o workflow bloqueia.
      - CLASSIFIER_ENV=${CLASSIFIER_ENV:-}
      - CLASSIFIER_DEV_BASE_ID=${CLASSIFIER_DEV_BASE_ID:-}
      - CLASSIFIER_DEV_TABLE_ID=${CLASSIFIER_DEV_TABLE_ID:-}
      - CLASSIFIER_SLACK_DEV_CHANNEL_ID=${CLASSIFIER_SLACK_DEV_CHANNEL_ID:-}
      - ROUTER_OBSERVER_WORKFLOW_ID=${ROUTER_OBSERVER_WORKFLOW_ID:-}
      - ROUTER_OBSERVED_WORKFLOW_ID=${ROUTER_OBSERVED_WORKFLOW_ID:-}
      - ROUTER_ALERTS_ENABLED=${ROUTER_ALERTS_ENABLED:-false}
      - OBS_LLM_INPUT_USD_PER_MILLION=${OBS_LLM_INPUT_USD_PER_MILLION:-}
      - OBS_LLM_OUTPUT_USD_PER_MILLION=${OBS_LLM_OUTPUT_USD_PER_MILLION:-}
      # Global: habilitar so apos revisar console.log dos demais workflows locais.
      - CODE_ENABLE_STDOUT=${ROUTER_OBS_STDOUT_ENABLED:-false}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    name: Validate VozDoCliente
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate workflow structure
        run: python tests/validate_workflows.py

      - name: Test routing logic
        run: python tests/test_routing_logic.py

      - name: Test security and classification invariants
        run: python -m unittest discover -s tests -v

      - name: Test exported PII code (offline)
        run: node tests/test_pii_sanitization.cjs

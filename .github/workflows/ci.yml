name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Validate VozDoCliente
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate workflow structure
        run: python tests/validate_workflows.py

      - name: Test routing logic
        run: python tests/test_routing_logic.py

      - name: Test security and classification invariants
        run: python -m unittest discover -s tests -v

      - name: Test exported PII code (offline)
        run: node tests/test_pii_sanitization.cjs

      - name: Check retention workflow exports
        run: python scripts/build_retention_workflow.py --check

      - name: Test retention with synthetic Airtable responses (offline)
        run: node tests/test_retention.cjs

      - name: Test retention schema diagnostic (offline)
        run: node tests/test_retention_schema_diagnostic.cjs

      - name: Test DEV observability (offline)
        run: node tests/test_observability.cjs

      - name: Check optimized v4 DEV export
        run: python scripts/build_router_optimized_workflow.py --check

      - name: Test early deduplication and classification equivalence (offline)
        run: node tests/test_router_optimization.cjs

      - name: Check Router observability exports (offline)
        run: python scripts/build_router_observability.py --check

      - name: Test Router observability and safe failures (offline)
        run: node tests/test_router_observability.cjs
